# FS-Hub — copy .env.example to .env and set secrets before running.
services:
  backend:
    image: salmait1/fs-hub-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DB_HOST: database
      DB_PORT: "3306"
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - fshub-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: salmait1/fs-hub-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fshub-network

  database:
    image: mysql:8.0
    container_name: fshub_database
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-fs_hub_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fshub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - fshub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      MODEL_REGISTRY_PATH: /models
      DB_HOST: database
      DB_PORT: "3306"
    volumes:
      - ai_models:/models
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fshub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  adminer:
    profiles: [tools]
    image: adminer
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fshub-network

  watchtower:
    profiles: [ops]
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: true
    restart: always
    networks:
      - fshub-network

volumes:
  mysql_data:
  ai_models:
  redis_data:

networks:
  fshub-network:
    driver: bridge
