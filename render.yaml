## render.yaml — FS-Hub Render deployment blueprint
## Docs: https://render.com/docs/blueprint-spec
##
## HOW TO USE:
## 1. Push this file to GitHub, then in Render Dashboard → New → Blueprint → connect repo.
## 2. Render will create 3 services: fs-hub-backend, fs-hub-frontend, fs-hub-redis.
## 3. The frontend is already live at https://fs-hub-project-2.onrender.com.
##    The backend will get its own URL (e.g. https://fs-hub-backend.onrender.com).
## 4. After the first deploy, set these values manually in the Render Dashboard:
##
##    ── Backend service (fs-hub-backend) → Environment ──────────────────────────
##    DB_HOST      = <your MySQL host, e.g. from Railway or PlanetScale>
##    DB_NAME      = fs_hub_db
##    DB_USER      = <your MySQL user>
##    DB_PASSWORD  = <your MySQL password>
##
##    ── Frontend service (fs-hub-frontend) → Environment ────────────────────────
##    BACKEND_URL  = https://fs-hub-backend.onrender.com   (nginx proxy target)
##
##    ── Frontend service → Build & Deploy → Docker Build Args ───────────────────
##    WS_BASE_URL  = wss://fs-hub-backend.onrender.com/ws  (WebSocket direct)
##
## 5. Re-deploy the frontend service after setting those values.
##
## DATABASE NOTE: Render's free tier has no managed MySQL.
##   Recommended: Railway.app (free MySQL) or PlanetScale (free MySQL-compatible).
##   Set DB_SECURE=true when connecting to a cloud DB (Railway/PlanetScale use SSL).

services:
  # ── Backend (Dart server) ────────────────────────────────────────────────────
  - type: web
    name: fs-hub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_SECURE
        value: "false"           # change to "true" for Railway/PlanetScale (SSL required)
      - key: DB_HOST
        sync: false              # ← set in Render Dashboard after DB is provisioned
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false              # ← set in Render Dashboard
      - key: DB_USER
        sync: false              # ← set in Render Dashboard
      - key: DB_PASSWORD
        sync: false              # ← set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true      # Render auto-generates a secure secret
      - key: REDIS_HOST
        fromService:
          type: redis
          name: fs-hub-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: fs-hub-redis
          property: port
      # Allow requests from the frontend URL
      - key: CORS_ALLOWED_ORIGIN
        value: "https://fs-hub-project-2.onrender.com"

  # ── Frontend (Flutter Web served by Nginx) ───────────────────────────────────
  # Render Blueprint YAML does NOT support Docker build args.
  # Solution: the Flutter app calls relative /api/... URLs, and nginx proxies
  # them to BACKEND_URL at container startup via envsubst (no build arg needed).
  # WebSocket still needs a build arg — set it in the Render Dashboard UI:
  #   Service: fs-hub-frontend → Build & Deploy → Docker Build Args
  #   Key: WS_BASE_URL   Value: wss://fs-hub-backend.onrender.com/ws
  - type: web
    name: fs-hub-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # nginx proxy target — set this to the backend service URL after first deploy
      - key: BACKEND_URL
        value: "https://fs-hub-backend.onrender.com"

  # ── Redis (required for idempotency, rate-limiting & presence) ───────────────
  - type: redis
    name: fs-hub-redis
    plan: free
    ipAllowList: []              # only allow internal Render network (no public access)
