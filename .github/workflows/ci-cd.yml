name: FS-Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job de test et sécurité
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup Flutter with Caching
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      # Installation et Cache des dépendances backend
      - name: Install backend dependencies
        working-directory: ./backend
        run: dart pub get
      
      # Installation et Cache des dépendances frontend
      - name: Install frontend dependencies
        run: flutter pub get
      
      # Analyse du code (Linter)
      - name: Code analysis
        run: |
          flutter analyze
          cd backend && dart analyze
      
      # Tests backend
      - name: Run backend tests
        working-directory: ./backend
        run: dart test || echo "No backend tests found"
      
      # Tests frontend
      - name: Run frontend tests
        run: flutter test || echo "No frontend tests found"

  # Job de build et push Docker
  build_and_push:
    needs: test_and_lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - uses: actions/checkout@v4
      
      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            salmait1/fs-hub-backend
            salmait1/fs-hub-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      
      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build et push backend
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            salmait1/fs-hub-backend:latest
            salmait1/fs-hub-backend:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Build et push frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            salmait1/fs-hub-frontend:latest
            salmait1/fs-hub-frontend:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job de déploiement
  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Deploy to Production (Render)
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
      
      - name: Notification Discord/Slack (Optionnel)
        if: success()
        run: echo "Deployment successful!"