coverage:
  status:
    project:
      default:
        target: 55%
        threshold: 2%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: reach,diff,flags
  behavior: default
  require_changes: false

flags:
  backend:
    paths:
      - backend/lib/
  flutter:
    paths:
      - lib/
  ai-service:
    paths:
      - ai-service/app/
