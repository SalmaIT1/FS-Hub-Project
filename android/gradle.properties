org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Network timeouts (ms) for Gradle dependency downloads.
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000

flutter.compileSdkVersion=34
flutter.targetSdkVersion=34
